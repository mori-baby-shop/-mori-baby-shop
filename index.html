function toggleProduct(i){products[i].active=products[i].active===false?true:false;saveProducts();drawAdmin()}
function deleteProduct(i){if(confirm('確定刪除這個商品嗎？')){products.splice(i,1);saveProducts();drawAdmin()}}
function placeOrder(){if(!cname.value.trim()||!phone.value.trim()||!addr.value.trim())return alert('請把姓名、手機和門市／地址填完整 ♡');let orders=JSON.parse(localStorage.getItem('moriOrders')||'[]');let id='MB'+new Date().toISOString().slice(2,10).replaceAll('-','')+String(orders.length+1).padStart(3,'0');orders.push({id,date:new Date().toISOString(),name:cname.value,phone:phone.value,ship:ship.value,pay:pay.value,address:addr.value,note:note.value,items:cart});localStorage.setItem('moriOrders',JSON.stringify(orders));cart=[];save();cartItems.innerHTML=`<div class="done">♡<br><b>訂單已建立</b><p>訂單編號：${id}</p><div class="small">目前為 Demo 測試訂單，尚未實際付款或出貨。</div></div>`;cartBottom.innerHTML=''}function closeM(id){document.getElementById(id).classList.remove('open')}function backdrop(e,id){if(e.target.id===id)closeM(id)}render();updateCount();
  (async function(){
  try {
    const cloudProducts = await loadProductsFromSupabase();
    if (cloudProducts && cloudProducts.length > 0) {
      products = cloudProducts.map(p => ({
        ...p,
        active: p.is_active,
        sizes: Array.isArray(p.sizes) ? p.sizes : []
      }));
      render();
    }
  } catch (e) {
    alert('Supabase 商品載入失敗：' + e.message);
  }
})();
</script></body></html>
